[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/platform",
    "crates/services",
    "apps/desktop/src-tauri",
    "tests",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["BBQ Team"]
license = "MIT"
repository = "https://github.com/BBQ/BBQ"

[workspace.dependencies]
bbq-core = { path = "crates/core" }
bbq-storage = { path = "crates/storage" }
bbq-platform = { path = "crates/platform" }
bbq-services = { path = "crates/services" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.33", features = ["bundled"] }
async-trait = "0.1"
tokio = { version = "1.43", features = ["sync", "rt", "macros", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
