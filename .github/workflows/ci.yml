name: BBQ CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to upload assets to (optional, e.g. v2.5)'
        required: false
        default: ''

jobs:
  lint-and-check:
    name: Lint & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Frontend
        run: pnpm typecheck

      - name: Run Frontend Tests
        run: pnpm test

      - name: Build Frontend
        run: pnpm build

  rust-matrix:
    name: Rust Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm build

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Package Verification (Linux deb/AppImage)
        if: runner.os == 'Linux'
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          pnpm --filter @bbq/desktop tauri build --bundles deb,appimage --ci --no-sign || pnpm --filter @bbq/desktop tauri build --bundles deb --ci --no-sign
          DEB=$(ls target/release/bundle/deb/*.deb 2>/dev/null | head -n 1)
          if [ -z "$DEB" ]; then echo "Expected .deb package was not generated!"; exit 1; fi
          echo "Generated Debian package: $DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -I "$DEB" | grep -i "Package:"
          dpkg-deb -I "$DEB" | grep -i "libwebkit2gtk"
          if dpkg-deb -c "$DEB" | grep -E '\.(pdb|log)$'; then
            echo "Forbidden debug/log artifacts found in deb package!"; exit 1
          fi
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1 || true)
          if [ -n "$APPIMAGE" ]; then
            echo "Generated Linux AppImage: $APPIMAGE"
          else
            echo "AppImage packaging not available on this runner (requires FUSE mount / runtime privileges)"
          fi

      - name: Package & Standardize Artifacts (macOS ARM64)
        if: runner.os == 'macOS'
        run: |
          pnpm --filter @bbq/desktop tauri build --bundles app,dmg --ci --no-sign
          bash scripts/package-macos.sh

      - name: Upload macOS Release Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            target/release/release-artifacts/mac-arm64.app.zip
            target/release/release-artifacts/mac-arm64.dmg
            target/release/release-artifacts/checksums.txt
          if-no-files-found: error

      - name: Package & Standardize Artifacts (Windows x64)
        if: runner.os == 'Windows'
        run: |
          pnpm --filter @bbq/desktop tauri build --bundles nsis --ci --no-sign
          powershell -ExecutionPolicy Bypass -File scripts/package-windows.ps1

      - name: Upload Windows Release Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            target/release/release-artifacts/win-x64-setup.exe
            target/release/release-artifacts/win-x64.zip
            target/release/release-artifacts/checksums.txt
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: [rust-matrix]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Inspect and upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p release-assets
          cp artifacts/mac-arm64/mac-arm64.app.zip release-assets/
          cp artifacts/mac-arm64/mac-arm64.dmg release-assets/
          cp artifacts/win-x64/win-x64-setup.exe release-assets/
          cp artifacts/win-x64/win-x64.zip release-assets/

          echo "=== Standardized Release Assets to Upload ==="
          ls -lh release-assets/

          echo "=== SHA256 Checksums ==="
          sha256sum release-assets/mac-arm64.app.zip release-assets/mac-arm64.dmg release-assets/win-x64-setup.exe release-assets/win-x64.zip

          echo "Ensuring release $TAG_NAME exists..."
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "BBQ $TAG_NAME" --notes "Release $TAG_NAME"
          fi

          echo "Uploading standardized assets to release $TAG_NAME..."
          gh release upload "$TAG_NAME" \
            release-assets/mac-arm64.app.zip \
            release-assets/mac-arm64.dmg \
            release-assets/win-x64-setup.exe \
            release-assets/win-x64.zip \
            --clobber
