name: BBQ CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to upload assets to (optional, e.g. v2.5)'
        required: false
        default: ''
      allow_unsigned_macos:
        description: 'Allow unsigned macOS build if Apple credentials are not set'
        required: false
        default: 'true'

jobs:
  lint-and-check:
    name: Lint & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Frontend
        run: pnpm typecheck

      - name: Run Frontend Tests
        run: pnpm test

      - name: Build Frontend
        run: pnpm build

  rust-matrix:
    name: Rust Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm build

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Package Verification (Linux deb/AppImage)
        if: runner.os == 'Linux'
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          pnpm --filter @bbq/desktop tauri build --bundles deb,appimage --ci --no-sign || pnpm --filter @bbq/desktop tauri build --bundles deb --ci --no-sign
          DEB=$(ls target/release/bundle/deb/*.deb 2>/dev/null | head -n 1)
          if [ -z "$DEB" ]; then echo "Expected .deb package was not generated!"; exit 1; fi
          echo "Generated Debian package: $DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -I "$DEB" | grep -i "Package:"
          dpkg-deb -I "$DEB" | grep -i "libwebkit2gtk"
          if dpkg-deb -c "$DEB" | grep -E '\.(pdb|log)$'; then
            echo "Forbidden debug/log artifacts found in deb package!"; exit 1
          fi
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1 || true)
          if [ -n "$APPIMAGE" ]; then
            echo "Generated Linux AppImage: $APPIMAGE"
          else
            echo "AppImage packaging not available on this runner (requires FUSE mount / runtime privileges)"
          fi

      - name: Package & Standardize Artifacts (macOS ARM64)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BBQ_RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
          BBQ_ALLOW_UNSIGNED_MACOS: ${{ inputs.allow_unsigned_macos || vars.BBQ_ALLOW_UNSIGNED_MACOS || 'true' }}
        run: |
          pnpm --filter @bbq/desktop tauri build --bundles app --ci --no-sign
          bash scripts/package-macos.sh

      - name: Upload macOS Release Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            target/release/release-artifacts/BBQ-mac-arm64.app.zip
            target/release/release-artifacts/BBQ-mac-arm64.dmg
            target/release/release-artifacts/checksums.txt
          if-no-files-found: error

      - name: Package & Standardize Artifacts (Windows x64)
        if: runner.os == 'Windows'
        run: |
          pnpm --filter @bbq/desktop tauri build --bundles nsis --ci --no-sign
          powershell -ExecutionPolicy Bypass -File scripts/package-windows.ps1

      - name: Upload Windows Release Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            target/release/release-artifacts/BBQ-win-x64-setup.exe
            target/release/release-artifacts/BBQ-win-x64.zip
            target/release/release-artifacts/checksums.txt
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: [lint-and-check, rust-matrix]
    if: |
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) &&
      !cancelled() &&
      needs.lint-and-check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Inspect and upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p release-assets
          UPLOAD_ASSETS=()
          HAS_WIN=false
          HAS_MAC=false

          # 1. Platform-aware staging: Windows x64 (verified by Windows cargo check/test & NSIS packaging)
          if [ -f artifacts/win-x64/BBQ-win-x64-setup.exe ] && [ -f artifacts/win-x64/BBQ-win-x64.zip ]; then
            echo "Staging verified Windows x64 release artifacts..."
            cp artifacts/win-x64/BBQ-win-x64-setup.exe release-assets/
            cp artifacts/win-x64/BBQ-win-x64.zip release-assets/
            UPLOAD_ASSETS+=(release-assets/BBQ-win-x64-setup.exe release-assets/BBQ-win-x64.zip)
            HAS_WIN=true
          else
            echo "[Notice] Windows x64 release artifacts not found or incomplete."
          fi

          # 2. Platform-aware staging: macOS ARM64 (verified by macOS cargo check/test & packaging script)
          if [ -f artifacts/mac-arm64/BBQ-mac-arm64.app.zip ] && [ -f artifacts/mac-arm64/BBQ-mac-arm64.dmg ]; then
            echo "Staging verified macOS ARM64 release artifacts..."
            cp artifacts/mac-arm64/BBQ-mac-arm64.app.zip release-assets/
            cp artifacts/mac-arm64/BBQ-mac-arm64.dmg release-assets/
            UPLOAD_ASSETS+=(release-assets/BBQ-mac-arm64.app.zip release-assets/BBQ-mac-arm64.dmg)
            HAS_MAC=true
          else
            echo "[Notice] macOS ARM64 release artifacts not found or incomplete."
          fi

          # 3. Guard against accidental empty/zero artifact release publication
          if [ ${#UPLOAD_ASSETS[@]} -eq 0 ]; then
            echo "ERROR: No verified release artifacts found to publish! Both Windows and macOS staging failed." >&2
            exit 1
          fi

          echo "=== Standardized Release Assets to Upload ==="
          ls -lh release-assets/

          echo "=== SHA256 Checksums ==="
          sha256sum "${UPLOAD_ASSETS[@]}"

          # 4. Generate structured release notes with explicit platform disclosures
          NOTES_FILE=$(mktemp)
          cat << 'EOF' > "$NOTES_FILE"
          ## BBQ Release Assets

          ### Standardized Packages
          EOF

          if [ "$HAS_WIN" = "true" ]; then
            cat << 'EOF' >> "$NOTES_FILE"
          - **Windows x64 Installer**: `BBQ-win-x64-setup.exe` (currentUser NSIS installer)
          - **Windows x64 Portable**: `BBQ-win-x64.zip` (standalone portable executable)
          EOF
          fi

          if [ "$HAS_MAC" = "true" ]; then
            cat << 'EOF' >> "$NOTES_FILE"
          - **macOS ARM64 Disk Image**: `BBQ-mac-arm64.dmg` (Apple Silicon drag-to-Applications installer)
          - **macOS ARM64 App Zip**: `BBQ-mac-arm64.app.zip` (standalone application bundle)

          > [!WARNING]
          > **macOS Gatekeeper Notice (Free Distribution)**
          > macOS packages are distributed in unsigned / ad-hoc signed mode without paid Apple Developer ID credentials.
          > When launching BBQ on macOS for the first time, macOS Gatekeeper may show a warning ("BBQ cannot be opened because Apple cannot check it for malicious software").
          >
          > **How to open on macOS:**
          > 1. Right-click (or Control-click) `BBQ.app` in `/Applications` and select **Open**.
          > 2. Click **Open** in the confirmation dialog.
          > 3. Alternatively, run in Terminal: `xattr -d com.apple.quarantine /Applications/BBQ.app`
          EOF
          fi

          # 5. Ensure release exists and publish assets
          echo "Ensuring release $TAG_NAME exists..."
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "BBQ $TAG_NAME" --notes-file "$NOTES_FILE"
          else
            gh release edit "$TAG_NAME" --notes-file "$NOTES_FILE" 2>/dev/null || true
          fi

          echo "Uploading standardized assets to release $TAG_NAME..."
          gh release upload "$TAG_NAME" "${UPLOAD_ASSETS[@]}" --clobber
