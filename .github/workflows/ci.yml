name: BBQ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-check:
    name: Lint & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Frontend
        run: pnpm typecheck

      - name: Run Frontend Tests
        run: pnpm test

      - name: Build Frontend
        run: pnpm build

  rust-matrix:
    name: Rust Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm build

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Package Verification (Linux deb/AppImage)
        if: runner.os == 'Linux'
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          pnpm --filter @bbq/desktop tauri build --bundles deb,appimage --ci --no-sign || pnpm --filter @bbq/desktop tauri build --bundles deb --ci --no-sign
          DEB=$(ls target/release/bundle/deb/*.deb 2>/dev/null | head -n 1)
          if [ -z "$DEB" ]; then echo "Expected .deb package was not generated!"; exit 1; fi
          echo "Generated Debian package: $DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -I "$DEB" | grep -i "Package:"
          dpkg-deb -I "$DEB" | grep -i "libwebkit2gtk"
          if dpkg-deb -c "$DEB" | grep -E '\.(pdb|log)$'; then
            echo "Forbidden debug/log artifacts found in deb package!"; exit 1
          fi
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1 || true)
          if [ -n "$APPIMAGE" ]; then
            echo "Generated Linux AppImage: $APPIMAGE"
          else
            echo "AppImage packaging not available on this runner (requires FUSE mount / runtime privileges)"
          fi

      - name: Package Verification (macOS bundle & DMG)
        if: runner.os == 'macOS'
        run: |
          pnpm --filter @bbq/desktop tauri build --bundles app,dmg --ci --no-sign
          APP=$(ls -d target/release/bundle/macos/*.app 2>/dev/null | head -n 1)
          if [ -z "$APP" ]; then echo "Expected macOS .app bundle was not generated!"; exit 1; fi
          echo "Generated macOS bundle: $APP"
          if find "$APP" -name "*.pdb" -o -name "*.log" | grep .; then
            echo "Forbidden debug/log artifacts found in macOS bundle!"; exit 1
          fi
          DMG=$(ls target/release/bundle/dmg/*.dmg 2>/dev/null | head -n 1 || true)
          if [ -n "$DMG" ]; then
            echo "Generated macOS DMG: $DMG"
          fi

      - name: Package Verification (Windows NSIS)
        if: runner.os == 'Windows'
        run: |
          pnpm --filter @bbq/desktop tauri build --bundles nsis --ci --no-sign
          $installers = Get-ChildItem -Path target/release/bundle/nsis/*.exe
          if ($installers.Count -eq 0) { throw "Expected NSIS installer was not generated!" }
          Write-Host "Generated Windows NSIS installer: $($installers[0].FullName) ($($installers[0].Length) bytes)"
          $badFiles = Get-ChildItem -Path target/release/bundle/nsis/ -Include *.pdb,*.log -Recurse
          if ($badFiles.Count -gt 0) { throw "Forbidden debug/log artifacts found in Windows bundle: $badFiles" }
